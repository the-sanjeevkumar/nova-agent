<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-label="Nova Agent">
  <!-- Nova mark: a geometric, minimal symbol suggesting a spark/star node -->
  <!-- Outer ring: precision and reliability -->
  <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Inner aurora arc: intelligence and modernity -->
  <path d="M 16 2 C 16 2 22 2 22 8 C 22 14 16 20 10 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Core node: the agent's focal point -->
  <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
  <!-- Three rays emanating: outreach and capability -->
  <path d="M 16 13.5 L 16 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 12.2 12.2 L 9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 19.8 12.2 L 23 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
